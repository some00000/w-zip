name: Windows installer

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nsis:
    name: NSIS installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Cache Tauri CLI
        id: cache-tauri
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/tauri-cli
          key: tauri-cli-2.12.4-${{ runner.os }}

      - name: Install Tauri CLI
        if: steps.cache-tauri.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version 2.12.4 --locked --root "${{ runner.tool_cache }}/tauri-cli"

      - name: Add Tauri CLI to PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${{ runner.tool_cache }}/tauri-cli/bin"

      - name: Build NSIS installer
        run: cargo tauri build --bundles nsis

      - name: Show installer
        shell: pwsh
        run: |
          $file = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $file) { throw "NSIS installer was not produced" }
          "Installer: ``$($file.Name)`` ($([math]::Round($file.Length / 1MB, 2)) MB)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Download it from this run's artifact **w-zip-windows-nsis**." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-Item $file.FullName

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: w-zip-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
